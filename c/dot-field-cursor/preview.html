<!DOCTYPE html><html><head><meta charset='utf-8'><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:grid;place-items:center;background:#07080f;font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'cv11','ss01'}button,input{font-family:inherit}*{-webkit-tap-highlight-color:transparent}button{-webkit-user-select:none;user-select:none}</style><style>:root {
  --bg: #070b1a;
  --fg: rgba(255, 255, 255, .9);
  --muted: rgba(255, 255, 255, .5);
  --accent: #2dd4bf;
  --dot: #1e2a4a;
  --radius: 14px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 18px 40px -12px rgba(0, 0, 0, .6);
}

.field {
  position: relative;
  width: 520px;
  height: 300px;
  border-radius: var(--radius);
  background: radial-gradient(120% 100% at 50% 0%, rgba(45, 212, 191, .06), transparent 60%), var(--bg);
  border: 1px solid rgba(255, 255, 255, .06);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .05);
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  isolation: isolate;
}

.dots {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(22, 1fr);
  grid-template-rows: repeat(13, 1fr);
  padding: 16px;
}

.dots i {
  display: grid;
  place-items: center;
}

.dots i::before {
  content: "";
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--dot);
  transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(var(--s, 1));
  background-color: color-mix(in srgb, var(--accent) calc(var(--f, 0) * 100%), var(--dot));
  box-shadow: 0 0 calc(var(--f, 0) * 8px) color-mix(in srgb, var(--accent) 60%, transparent);
}

.field.idle .dots i::before {
  transition: transform .7s var(--spring), background-color .5s var(--ease), box-shadow .5s var(--ease);
}

.cta {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) translate(var(--mx, 0px), var(--my, 0px));
  width: 176px;
  height: 48px;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  color: #04211d;
  background: var(--accent);
  font: 600 15px/1 system-ui, sans-serif;
  letter-spacing: -.01em;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 26px -8px rgba(45, 212, 191, .55), inset 0 1px 0 rgba(255, 255, 255, .5);
  transition: transform .5s var(--ease), background-color .2s ease, box-shadow .2s ease;
}

.cta span {
  display: block;
  transform: translate(calc(var(--mx, 0px) * .35), calc(var(--my, 0px) * .35));
  transition: transform .5s var(--ease);
}

.cta.pull {
  transition: transform .12s linear, background-color .2s ease;
}

@media (hover: hover) and (pointer: fine) {
  .cta:hover {
    background: color-mix(in srgb, var(--accent) 90%, white);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 16px 32px -8px rgba(45, 212, 191, .65), inset 0 1px 0 rgba(255, 255, 255, .6);
  }
}

.cta:active {
  transform: translate(-50%, -50%) translate(var(--mx, 0px), var(--my, 0px)) scale(.97);
  transition: transform .16s var(--ease);
}

.cta:focus-visible {
  outline: 2px solid rgba(255, 255, 255, .7);
  outline-offset: 3px;
}
</style></head><body><canvas id="__fx" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block"></canvas>

<script>(function(){var c=document.getElementById('__cur'),r=document.getElementById('__rip');addEventListener('mousemove',function(e){c.style.opacity=1;c.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'},true);addEventListener('mousedown',function(e){c.firstElementChild.style.transform='scale(.82)';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';r.classList.remove('go');void r.offsetWidth;r.classList.add('go')},true);addEventListener('mouseup',function(){c.firstElementChild.style.transform='scale(1)'},true)})();</script><script>const field = document.getElementById('field');
const dotsEl = document.getElementById('dots');
const cta = document.getElementById('cta');
const R = 120;
for (let i = 0; i < 286; i++) dotsEl.appendChild(document
  .createElement('i'));
const dots = [...dotsEl.children];
let centers = [];
let raf = 0;

const measure = () => {
  centers = dots.map((d) => {
    const r = d.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height /
      2
    ];
  });
};
measure();
field.classList.add('idle');

field.addEventListener('mousemove', (e) => {
  field.classList.remove('idle');
  cancelAnimationFrame(raf);
  dots.forEach((d, i) => {
    const dx = centers[i][0] - e.clientX,
      dy = centers[i][1] - e.clientY;
    const dist = Math.hypot(dx, dy),
      f = Math.max(0, 1 - dist / R);
    const push = f * f * 24;
    d.style.setProperty('--tx', (dx / (dist ||
      1)) * push + 'px');
    d.style.setProperty('--ty', (dy / (dist ||
      1)) * push + 'px');
    d.style.setProperty('--s', 1 + f * 2.4);
    d.style.setProperty('--f', f.toFixed(3));
  });
  const r = cta.getBoundingClientRect(),
    cx = r.left + r.width / 2,
    cy = r.top + r.height / 2;
  const d = Math.hypot(e.clientX - cx, e.clientY -
  cy);
  cta.classList.toggle('pull', d < R);
  const k = d < R ? 0.28 : 0;
  cta.style.setProperty('--mx', (e.clientX - cx) * k +
    'px');
  cta.style.setProperty('--my', (e.clientY - cy) * k +
    'px');
});

field.addEventListener('mouseleave', () => {
  field.classList.add('idle');
  dots.forEach((d) => {
    ['--tx', '--ty', '--f'].forEach((p) => d.style
      .setProperty(p, '0'));
    d.style.setProperty('--s', 1);
  });
  cta.classList.remove('pull');
  cta.style.setProperty('--mx', '0px');
  cta.style.setProperty('--my', '0px');
});
