  --box-h: 68px;

.stage-wrap {
  display: grid;
  place-items: center;
  min-height: 100vh;
}

.otp {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 20px;
  padding: 28px 32px 24px;
  border-radius: 22px;
  border: 1px solid rgba(255, 255, 255, .08);
  background: rgba(12, 18, 38, .55);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
}

.slots {
  position: relative;
  display: flex;
  gap: var(--gap);
}

.slot {
  position: relative;
  display: grid;
  place-items: center;
  width: var(--box-w);
  height: var(--box-h);
  border-radius: var(--radius);
  background: var(--slot);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 0 0 1px rgba(255, 255, 255, .04) inset;
  overflow: hidden;
  transition: background-color .24s var(--ease), box-shadow .24s var(--ease);

.slot.on {
  background: var(--slot-on);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .1) inset, 0 0 0 1px rgba(255, 255, 255, .1) inset;
}

.slot.full {
  background: var(--light);
  box-shadow: 0 1px 0 #fff inset, 0 6px 16px -8px rgba(0, 0, 0, .6);
}

.slot i {
  color: var(--ink);
  font: 600 28px/1 system-ui, -apple-system, sans-serif;
  font-style: normal;
  font-variant-numeric: tabular-nums;
  opacity: 0;
  transform: translateY(-12px) scale(.8);
}

.slot.full i {
  opacity: 1;
  transform: none;
  transition: transform .3s var(--spring), opacity .14s var(--ease);
}

.caret {
  position: absolute;
  top: 17px;
  left: 0;
  width: 2px;
  height: 34px;
  border-radius: 1px;
  background: var(--light);
  transform: translateX(26px);
  transition: transform .26s var(--ease), opacity .2s var(--ease);
  animation: blink 1s steps(2) infinite;
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}

.otp.ok .caret,
.otp.idle .caret {
  opacity: 0;
  animation: none;
}

.wash {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  border-radius: var(--radius);
  background: var(--light);
  clip-path: inset(0 50% 0 50% round var(--radius));
  transition: clip-path .32s var(--ease);
  pointer-events: none;
}

.otp.ok .wash {
  clip-path: inset(0 0 0 0 round var(--radius));
}

.ck {
  width: 14px;
  height: 28px;
  border: solid var(--ink);
  border-width: 0 5px 5px 0;
  border-radius: 2px;
  opacity: 0;
  transform: translateY(8px) rotate(45deg);
  transition: opacity .2s var(--ease), transform .3s var(--ease);
}

.otp.ok .ck {
  opacity: 1;
  transform: translateY(-3px) rotate(45deg);
  transition-delay: .28s;
}

.otp.ok .slot i {
  transform: translateY(14px);
  opacity: 0;
}

#otpIn {
  position: absolute;
  inset: 0 0 auto 0;
  height: var(--box-h);
  opacity: 0;
  cursor: text;
}

.hint {
  margin: 0;
  color: var(--muted);
  font: 500 14px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: .01em;
  transition: color .24s var(--ease);
}

.otp.ok .hint {
  color: var(--fg);
}

.otp.err .slot {
  background: color-mix(in srgb, var(--accent) 24%, var(--slot));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent) inset;
}

.otp.err .hint {
  color: var(--accent);
}

const input = document.getElementById('otpIn');

const hint = root.querySelector('.hint');
const STEP = 54 + 10;

function paint() {
  const v = input.value.replace(/\D/g, '').slice(0, 6);
  input.value = v;
  slots.forEach((s, i) => {
    const had = s.classList.contains('full');
    const digit = v[i] || '';
    if (s.firstChild.textContent !== digit) s
      .firstChild.textContent = digit;
    s.classList.toggle('full', i < v.length);
    s.classList.toggle('on', i === v.length &&
      document.activeElement === input);
    if (i < v.length && !had) {
      s.firstChild.style.transition = 'none';
      s.firstChild.style.transform =
        'translateY(-12px) scale(.8)';

    `translateX(${Math.min(v.length, 5) * STEP + 26}px)`;

    input && !v.length);
  if (v.length === 6) {
    root.classList.add('ok');
    hint.textContent = 'Code verified';
    input.blur();

  input.value = '';
  hint.textContent = 'Enter the 6-digit code';
  slots.forEach((s) => s.classList.remove('full', 'on'));
  paint();

input.addEventListener('focus', paint);
