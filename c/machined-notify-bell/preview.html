.wrap {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
}

.bell {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  height: 64px;
  padding: 0 32px 0 24px;
  border: 1px solid rgba(255, 255, 255, .08);
  border-radius: var(--radius);
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bot));
  color: var(--fg);
  font: 500 21px/1 -apple-system, "Segoe UI", system-ui, sans-serif;
  letter-spacing: .01em;
  cursor: pointer;
  outline: none;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .16),
    inset 0 -2px 5px rgba(0, 0, 0, .55),
    var(--shadow);
  transition:
    background .3s var(--ease),
    color .3s var(--ease),
    box-shadow .3s var(--ease),
    border-color .3s var(--ease),
    transform .16s var(--ease);
}

.bell:hover {
  background: linear-gradient(180deg, #43464f, #212329);
}

.bell:active {
  transform: scale(.97);
}

.bell:focus-visible {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .16),
    inset 0 -2px 5px rgba(0, 0, 0, .55),
    var(--shadow),
    0 0 0 3px rgba(229, 72, 77, .55);
}

.bell[aria-pressed='true'] {
  background: linear-gradient(180deg, #fbfbfc, #d8dade);
  color: #17181b;
  border-color: rgba(0, 0, 0, .12);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .9),
    inset 0 -2px 4px rgba(0, 0, 0, .16),
    var(--shadow);
}

.ico {
  display: grid;
  width: 26px;
  height: 26px;
  transform-origin: 50% 16%;
}

.ico svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.bell[aria-pressed='true'] .ico {
  animation: ring 1.26s var(--ease);
}

@keyframes ring {
  0% {
    transform: rotate(0);
  }

  11% {
    transform: rotate(22deg);
  }

  33% {
    transform: rotate(-19deg);
  }

  55% {
    transform: rotate(13deg);
  }

  77% {
    transform: rotate(-7deg);
  }

  100% {
    transform: rotate(0);
  }
}

.txt {
  display: grid;
}

.txt span {
  grid-area: 1 / 1;
  white-space: nowrap;
  transition: opacity .2s var(--ease), filter .2s var(--ease);
}

.on {
  opacity: 0;
  filter: blur(2px);
}

.bell[aria-pressed='true'] .off {
  opacity: 0;
  filter: blur(2px);
}

.bell[aria-pressed='true'] .on {
  opacity: 1;
  filter: blur(0);
}

.badge {
  position: absolute;
  top: -8px;
  right: -8px;
  min-width: 26px;
  height: 26px;
  padding: 0 7px;
  border-radius: 13px;
  background: linear-gradient(180deg, #f05a5f, var(--accent));
  color: #fff;
  font: 600 14px/26px -apple-system, "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
  text-align: center;
  transform: scale(0);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .45),
    inset 0 -1px 2px rgba(0, 0, 0, .3),
    0 2px 6px rgba(0, 0, 0, .45);
  transition: transform .3s var(--spring);
}

.bell[aria-pressed='true'] .badge {
  transform: scale(1);
  transition-delay: .12s;
}

@media (prefers-reduced-motion: reduce) {

  .bell,
  .ico,
  .badge,
  .txt span {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
