<!DOCTYPE html><html><head><meta charset='utf-8'><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:grid;place-items:center;background:linear-gradient(135deg,#f3ecff 0%,#fdf4fa 55%,#eef6ff 100%);font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'cv11','ss01'}button,input{font-family:inherit}*{-webkit-tap-highlight-color:transparent}button{-webkit-user-select:none;user-select:none}</style><style>:root {
  --bg: #eef1f7;
  --fg: #1e2a44;
  --muted: #5b6785;
  --accent: #f5a524;
  --clay: #d6e4ff;
  --done: #f4f6fa;
  --radius: 34px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --shadow: 0 2px 3px rgba(30, 42, 68, .06), 0 16px 30px -12px rgba(30, 42, 68, .34);
  --inner: inset -6px -6px 12px rgba(30, 42, 68, .10), inset 6px 6px 12px rgba(255, 255, 255, .75);
}

.stage {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
}

.fuse {
  --dur: 3000ms;
  position: relative;
  display: inline-grid;
  place-items: center;
  width: 216px;
  height: 68px;
  padding: 0 0 2px;
  border: 0;
  border-radius: var(--radius);
  background: var(--clay);
  background-image: linear-gradient(180deg, rgba(255, 255, 255, .8), rgba(255, 255, 255, 0) 62%);
  color: var(--fg);
  font: 600 21px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  letter-spacing: -.01em;
  cursor: pointer;
  outline: none;
  box-shadow: var(--inner), var(--shadow);
  transition: background-color .24s var(--ease), transform .18s var(--spring), box-shadow .24s var(--ease);
}

@media (hover: hover) and (pointer: fine) {
  .fuse:hover {
    background-color: color-mix(in srgb, var(--clay) 90%, #fff);
  }
}

.fuse:active {
  transform: scale(.94);
}

.fuse:focus-visible {
  box-shadow: var(--inner), 0 0 0 3px var(--bg), 0 0 0 5px var(--accent), var(--shadow);
}

.face {
  grid-area: 1 / 1;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  filter: blur(2px);
  transition: opacity .2s var(--ease), filter .2s var(--ease);
}

.face b {
  display: inline-block;
  font-size: 19px;
  font-weight: 600;
  transform: rotate(-70deg);
  transition: transform .24s var(--spring);
}

.fuse[data-state='idle'] .idle,
.fuse[data-state='burning'] .undo,
.fuse[data-state='done'] .done {
  opacity: 1;
  filter: blur(0);
}

.fuse[data-state='burning'] .undo b {
  transform: rotate(0);
}

.rim {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.rim rect {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-dasharray: 1 1;
  stroke-dashoffset: 1;
  opacity: 0;
  filter: drop-shadow(0 0 3px rgba(245, 165, 36, .65));
  vector-effect: non-scaling-stroke;
}

.fuse[data-state='burning'] .rim rect {
  opacity: 1;
  animation: burn var(--dur) linear forwards;
}

.fuse[data-state='burning']:hover .rim rect {
  animation-play-state: paused;
}

@keyframes burn {
  from {
    stroke-dashoffset: 0;
  }

  to {
    stroke-dashoffset: -1;
  }
}

.fuse[data-state='done'] {
  background: var(--done);
  color: var(--fg);
  box-shadow: inset -6px -6px 12px rgba(30, 42, 68, .07), inset 6px 6px 12px rgba(255, 255, 255, .95), 0 2px 3px rgba(30, 42, 68, .05), 0 16px 30px -14px rgba(30, 42, 68, .28);
}

.fuse[data-state='done'] .done {
  animation: snap .5s var(--spring);
}

@keyframes snap {
  0% {
    transform: scale(.9);
  }

  60% {
    transform: scale(1.04);
  }

  100% {
    transform: scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {

  .fuse,
  .face,
  .face b {
    transition-duration: .01ms;
  }
}

</div>

<script>(function(){var c=document.getElementById('__cur'),r=document.getElementById('__rip');addEventListener('mousemove',function(e){c.style.opacity=1;c.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'},true);addEventListener('mousedown',function(e){c.firstElementChild.style.transform='scale(.82)';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';r.classList.remove('go');void r.offsetWidth;r.classList.add('go')},true);addEventListener('mouseup',function(){c.firstElementChild.style.transform='scale(1)'},true)})();</script><script>const fuse = document.getElementById('fuse');
const rect = fuse.querySelector('rect');
