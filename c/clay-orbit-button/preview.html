<!DOCTYPE html><html><head><meta charset='utf-8'><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:grid;place-items:center;background:linear-gradient(135deg,#f3ecff 0%,#fdf4fa 55%,#eef6ff 100%);font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'cv11','ss01'}button,input{font-family:inherit}*{-webkit-tap-highlight-color:transparent}button{-webkit-user-select:none;user-select:none}</style><style>@property --ang {
  syntax: '<angle>';
  inherits: false;
  initial-value: 0deg;
}

:root {
  --bg: #f6f1ec;
  --fg: #3d2b26;
  --muted: #8a7168;
  --accent: #ff7a59;
  --accent-soft: #ffd6e0;
  --radius: 30px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --shadow: 0 2px 4px rgba(61, 43, 38, .06), 0 14px 28px rgba(61, 43, 38, .12);
}

.wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
}

.ob {
  --spd: 3s;
  position: relative;
  padding: 2px;
  border: 0;
  border-radius: var(--radius);
  cursor: pointer;
  isolation: isolate;
  background: conic-gradient(from var(--ang), rgba(255, 255, 255, .5) 0 52%, var(--accent) 74%, #fff 88%, rgba(255, 255, 255, .5) 100%);
  animation: spin var(--spd) linear infinite;
  box-shadow: var(--shadow);
  transition: transform .35s var(--spring), box-shadow .4s var(--ease);
}

.ob::before {
  content: "";
  position: absolute;
  inset: -2px;
  z-index: -1;
  border-radius: inherit;
  filter: blur(14px);
  opacity: .35;
  transition: opacity .4s var(--ease);
  background: conic-gradient(from var(--ang), transparent 0 52%, var(--accent) 78%, #ffb9a3 90%, transparent 100%);
}

@keyframes spin {
  to {
    --ang: 360deg;
  }
}

.ob:hover {
  --spd: 1.2s;
  transform: translateY(-2px);
  box-shadow: 0 2px 4px rgba(61, 43, 38, .08), 0 20px 36px rgba(61, 43, 38, .18);
}

.ob:hover::before {
  opacity: .65;
}

.ob:active {
  transform: scale(.94);
}

.ob:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 4px;
}

.in {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 56px;
  padding: 0 28px;
  border-radius: 28px;
  overflow: hidden;
  color: var(--fg);
  background: radial-gradient(120% 140% at 50% 0%, #fdf6f1, #f2e6de);
  font-size: 15px;
  font-weight: 650;
  letter-spacing: .02em;
  box-shadow: inset -6px -6px 12px rgba(61, 43, 38, .08), inset 6px 6px 12px rgba(255, 255, 255, .8);
  transition: background .4s var(--ease);
}

.ob:hover .in {
  background: radial-gradient(120% 140% at 50% 0%, #fffaf6, #f8ebe3);
}

.lbl {
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform .5s var(--ease), opacity .3s var(--ease);
}

.l2 {
  position: absolute;
  inset: 0;
  justify-content: center;
  transform: translateY(150%);
  opacity: 0;
  color: #1f8a5b;
}

.l2 svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.arr {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform .4s var(--spring), opacity .3s var(--ease);
}

.ob:hover .arr {
  transform: translateX(5px);
}

.ob.done .l1 {
  transform: translateY(-150%);
  opacity: 0;
}

.ob.done .l2 {
  transform: none;
  opacity: 1;
}

.ob.done .arr {
  opacity: 0;
  transform: scale(.5);
}

@media (prefers-reduced-motion: reduce) {

  .ob,
  .ob::before {
    animation: none;
  }
}
</style></head><body><div id="__z" style="width:100%;height:100%;display:grid;place-items:center;transform-origin:50% 50%"><div class="wrap">

        You're safe
      </span>
      <svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </span>
  </button>
</div>
