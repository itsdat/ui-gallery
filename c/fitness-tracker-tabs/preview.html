<!DOCTYPE html><html><head><meta charset='utf-8'><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:grid;place-items:center;background:linear-gradient(135deg,#f3ecff 0%,#fdf4fa 55%,#eef6ff 100%);font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'cv11','ss01'}button,input{font-family:inherit}*{-webkit-tap-highlight-color:transparent}button{-webkit-user-select:none;user-select:none}</style><style>:root {
  --bg: #e6eaf2;
  --ink: #4b5563;
  --muted: #8a93a6;
  --accent: #6c8cff;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.3, .64, 1);
  --shadow-lo: #c5cad6;
  --shadow-hi: #ffffff;
  --sh: 8px 8px 18px var(--shadow-lo), -8px -8px 18px var(--shadow-hi);
  --sh-sm: 4px 4px 10px var(--shadow-lo), -4px -4px 10px var(--shadow-hi);
  --sh-in: inset 4px 4px 10px var(--shadow-lo), inset -4px -4px 10px var(--shadow-hi);
}

.ui {
  width: 480px;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.tabs {
  position: relative;
  display: flex;
  padding: 6px;
  border-radius: 20px;
  background: var(--bg);
  box-shadow: var(--sh-in);
}

.pill {
  position: absolute;
  top: 6px;
  bottom: 6px;
  left: 6px;
  width: 0;
  border-radius: 14px;
  background: var(--bg);
  box-shadow: var(--sh-sm), inset 1px 1px 1px var(--shadow-hi);
  transition: left .35s var(--spring), width .35s var(--spring);
}

.tab {
  position: relative;
  z-index: 1;
  flex: 1;
  height: 44px;
  border: 0;
  background: none;
  border-radius: 14px;
  font: 600 14px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  letter-spacing: .01em;
  color: var(--muted);
  cursor: pointer;
  transition: color .3s var(--ease), transform .16s var(--ease);
}

@media (hover: hover) {
  .tab:hover {
    color: var(--ink);
  }
}

.tab:active {
  transform: scale(.96);
}

.tab:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.tab.on {
  color: var(--accent);
}

.panel {
  margin-top: 16px;
  padding: 22px 24px 18px;
  border-radius: 22px;
  background: var(--bg);
  box-shadow: var(--sh);
  overflow: hidden;
}

.cap {
  margin: 0;
  font-size: 14px;
  letter-spacing: .01em;
  color: var(--muted);
  transition: opacity .25s var(--ease), transform .4s var(--ease), filter .25s var(--ease);
}

.row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-top: 6px;
}

strong {
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
  transition: opacity .25s var(--ease), transform .4s var(--ease), filter .25s var(--ease);
}

.delta {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: #3f7d54;
  background: #dbe9e0;
  box-shadow: inset 1px 1px 3px var(--shadow-lo), inset -1px -1px 3px var(--shadow-hi);
}

.swap .cap,
.swap strong {
  opacity: 0;
  transform: translateY(6px);
  filter: blur(2px);
}

.spark {
  display: block;
  width: 100%;
  height: 50px;
  margin-top: 12px;
}

.spark path {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 420;
  stroke-dashoffset: 0;
}

.spark.draw path {
  animation: dash .9s var(--ease);
}

@keyframes dash {
  from {
    stroke-dashoffset: 420;
  }

  to {
    stroke-dashoffset: 0;
  }
}

@media (prefers-reduced-motion: reduce) {

  .pill,
  .cap,
  strong,
  .tab {
    transition-duration: .01ms;
  }

  .spark.draw path {
    animation: none;
  }
}
</style></head><body><div id="__z" style="width:100%;height:100%;display:grid;place-items:center;transform-origin:50% 50%"><div class="ui">
  <div class="tabs" id="tabs" role="tablist">
    <span class="pill" id="pill"></span>
    <button class="tab on" role="tab" data-n="12480" data-c="Steps this week" data-d="+12.4%">Steps</button>
    <button class="tab" role="tab" data-n="3926" data-c="Calories burned today" data-d="+4.1%">Calories</button>
    <button class="tab" role="tab" data-n="148" data-c="Workouts logged" data-d="+31%">Workouts</button>
    <button class="tab" role="tab" data-n="9" data-c="Active minutes" data-d="+2">Minutes</button>
  </div>
  <section class="panel">
    <p class="cap" id="cap">Steps this week</p>
    <div class="row">
      <strong id="num">12,480</strong>
      <span class="delta" id="delta">+12.4%</span>

      <path id="line" d="M0 38 C30 30 50 40 80 26 S130 30 160 18 S230 24 300 6" />
    </svg>
  </section>
</div>
</div><div id="__cur" style="position:fixed;left:0;top:0;width:34px;height:34px;pointer-events:none;z-index:2147483647;opacity:0;transform:translate(-100px,-100px);transition:opacity .25s"><svg viewBox="0 0 24 24" width="34" height="34" style="filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))"><path d="M4 2.5v17.2l4.6-4.1 3.1 6.6 3-1.4-3.1-6.5 6.3-.3z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<style>#__rip{position:fixed;width:12px;height:12px;border-radius:50%;border:3px solid rgba(124,92,255,.9);pointer-events:none;z-index:2147483646;transform:translate(-50%,-50%) scale(.2);opacity:0}#__rip.go{animation:__rip .55s ease-out}@keyframes __rip{0%{opacity:.9;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.2)}}</style><div id="__rip"></div>
<script>(function(){var c=document.getElementById('__cur'),r=document.getElementById('__rip');addEventListener('mousemove',function(e){c.style.opacity=1;c.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'},true);addEventListener('mousedown',function(e){c.firstElementChild.style.transform='scale(.82)';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';r.classList.remove('go');void r.offsetWidth;r.classList.add('go')},true);addEventListener('mouseup',function(){c.firstElementChild.style.transform='scale(1)'},true)})();</script><script>const tabs = [...document.querySelectorAll('.tab')];
const pill = document.getElementById('pill');
const num = document.getElementById('num');
const cap = document.getElementById('cap');
const delta = document.getElementById('delta');
const panel = document.querySelector('.panel');
const spark = document.querySelector('.spark');
const line = document.getElementById('line');
const LINES = [
  'M0 38 C30 30 50 40 80 26 S130 30 160 18 S230 24 300 6',
  'M0 30 C40 40 60 10 100 22 S160 44 200 20 S260 12 300 14',
  'M0 42 C50 40 80 36 120 30 S190 20 230 16 S280 8 300 4',
  'M0 24 C30 24 60 34 100 28 S170 14 210 30 S270 26 300 20'
];
let current = 12480,
  raf = 0;

const place = (t) => {
  pill.style.left = t.offsetLeft + 'px';
  pill.style.width = t.offsetWidth + 'px';
};

const count = (to) => {
  cancelAnimationFrame(raf);
  const from = current,
    t0 = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - t0) / 700),
      e = 1 - Math.pow(1 - p, 3);
    current = Math.round(from + (to - from) * e);
    num.textContent = current.toLocaleString('en-US');
    if (p < 1) raf = requestAnimationFrame(step);
  })(t0);
};

tabs.forEach((t, i) => t.addEventListener('click', () => {
  tabs.forEach((x) => x.classList.toggle('on', x ===
    t));
  place(t);
  panel.classList.add('swap');
  setTimeout(() => {
    count(+t.dataset.n);
    cap.textContent = t.dataset.c;
    delta.textContent = t.dataset.d;
    line.setAttribute('d', LINES[i]);
    panel.classList.remove('swap');
  }, 180);
  spark.classList.remove('draw');
  void spark.getBoundingClientRect();
  spark.classList.add('draw');

requestAnimationFrame(() => place(tabs[0]));
