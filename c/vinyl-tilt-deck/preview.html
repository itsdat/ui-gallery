<!DOCTYPE html><html><head><meta charset='utf-8'><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:grid;place-items:center;background:#07080f;font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'cv11','ss01'}button,input{font-family:inherit}*{-webkit-tap-highlight-color:transparent}button{-webkit-user-select:none;user-select:none}</style><style>:root {
  --bg: #0b0f0a;

  --accent: #7cff6b;
  --amber: #ffb000;
  --radius: 4px;

  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.3, .64, 1);
}

.area {
  display: grid;
  place-items: center;
  width: 560px;
  height: 340px;
  perspective: 900px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
}

.card {
  --rx: 0deg;
  --ry: 0deg;
  --gx: 50%;
  --gy: 30%;
  position: relative;
  width: 252px;
  height: 324px;
  padding: 12px;
  border-radius: var(--radius);
  color: var(--accent);
  background: linear-gradient(160deg, #121a0f, #070a06 70%);
  box-shadow: var(--shadow);
  transform-style: preserve-3d;
  transform: rotateX(var(--rx)) rotateY(var(--ry));
  transition: transform .5s ease-out, box-shadow .5s var(--ease);
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(124, 255, 107, .2), inset 0 1px 0 rgba(255, 255, 255, .06);
}

.card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px);
  opacity: .45;
}

.card.live {
  transition: transform .08s linear, box-shadow .2s var(--ease);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 4px 8px rgba(0, 0, 0, .55), 0 32px 56px -20px rgba(0, 0, 0, .95);
}

.art {
  position: relative;
  height: 172px;
  border-radius: 3px;
  overflow: hidden;
  transform: translateZ(26px);
  background: radial-gradient(circle at 50% 45%, #152410, #060a05 75%);
  box-shadow: inset 0 0 0 1px rgba(124, 255, 107, .16), 0 12px 20px -12px rgba(0, 0, 0, .85);
}

.disc {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120px;
  height: 120px;
  margin: -60px 0 0 -60px;
  border-radius: 50%;
  background: repeating-radial-gradient(circle at 50% 50%, #0c120a 0 3px, #1a2716 3px 4px);
  box-shadow: inset 0 0 0 1px rgba(124, 255, 107, .28);
  transition: transform .5s var(--spring);
}

.label {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 38px;
  height: 38px;
  margin: -19px 0 0 -19px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: inset 0 0 0 6px #070a06;
}

.card.live .disc {
  transform: translate(calc(var(--ry) * -.8), calc(var(--rx) * .8));
}

.track {
  position: absolute;
  left: 10px;
  bottom: 8px;
  font-size: 10px;
  letter-spacing: .16em;
  color: var(--amber);
  text-shadow: 0 0 8px currentColor;
}

.badge {
  position: absolute;
  top: 26px;
  right: 22px;
  padding: 5px 10px;
  border-radius: 3px;
  transform: translateZ(60px);
  font: 700 10px/1 ui-monospace, Menlo, monospace;
  letter-spacing: .14em;
  color: #0a0f08;
  background: var(--amber);
  box-shadow: 0 6px 12px -4px rgba(0, 0, 0, .7);
}

.info {
  padding: 16px 6px 0;
  transform: translateZ(40px);
}

.title {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.01em;
  text-shadow: 0 0 8px currentColor;
}

.info p {
  margin: 6px 0 0;
  font-size: 12.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.dot {
  color: var(--amber);
}

.barcode {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 16px;
  height: 26px;
  display: flex;
  gap: 3px;
  transform: translateZ(18px);
  opacity: .85;
}

.barcode i {
  flex: 1;
  background: var(--accent);
  border-radius: 1px;
}

.barcode i:nth-child(3n) {
  flex: .5;
}

.barcode i:nth-child(4n) {
  flex: 1.6;
}

.barcode i:nth-child(5n) {
  flex: .8;
}

.glare {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  mix-blend-mode: soft-light;
  opacity: 0;
  transition: opacity .4s var(--ease);
  background: radial-gradient(260px circle at var(--gx) var(--gy), rgba(255, 255, 255, .8), transparent 60%);
}

.card.live .glare {
  opacity: 1;
}

@media (prefers-reduced-motion: reduce) {

  .card,
  .disc,
  .glare {
    transition-duration: .01ms;
  }
}
