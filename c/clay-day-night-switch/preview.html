<!DOCTYPE html><html><head><meta charset='utf-8'><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:grid;place-items:center;background:linear-gradient(135deg,#f3ecff 0%,#fdf4fa 55%,#eef6ff 100%);font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'cv11','ss01'}button,input{font-family:inherit}*{-webkit-tap-highlight-color:transparent}button{-webkit-user-select:none;user-select:none}</style><style>:root {
  --bg: #eef1ff;
  --fg: #2b3357;
  --muted: #8b93b8;
  --accent: #ff9fb8;
  --radius: 32px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --w: 300px;
  --h: 132px;
  --pad: 10px;
  --k: 108px;
  --shadow: inset -6px -6px 12px rgba(0, 0, 0, .08), inset 6px 6px 12px rgba(255, 255, 255, .7), 0 18px 30px -14px rgba(43, 51, 87, .35), 0 4px 8px -4px rgba(43, 51, 87, .2);
}

.wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Inter, system-ui, sans-serif;
}

.sw {
  position: relative;
  width: var(--w);
  height: var(--h);
  padding: var(--pad);
  border: 0;
  border-radius: var(--radius);
  cursor: pointer;
  background: #f4f6ff;
  box-shadow: var(--shadow);
  transition: transform .35s var(--spring);
}

.sw:hover {
  transform: translateY(-2px) scale(1.015);
}

.sw:active {
  transform: scale(.94);
}

.sw:focus-visible {
  outline: 3px solid var(--fg);
  outline-offset: 4px;
}

.scene {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: calc(var(--radius) - var(--pad));
  box-shadow: inset 0 6px 12px rgba(43, 51, 87, .18), inset 0 -2px 4px rgba(255, 255, 255, .6);
}

.sky {
  position: absolute;
  inset: 0;
  transition: opacity .6s var(--ease);
}

.night {
  background: linear-gradient(180deg, #2b3357 0%, #46508a 60%, #6b74b0 100%);
  opacity: 0;
}

.day {
  background: linear-gradient(180deg, #d6e4ff 0%, #ffe9f0 70%, #ffd6e0 100%);
}

.sw[aria-checked="false"] .night {
  opacity: 1;
}

.sw[aria-checked="false"] .day {
  opacity: 0;
}

.hills {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  transition: transform .7s var(--ease);
}

.hills.back path {
  fill: #b9e6c9;
}

.hills.front path {
  fill: #7fcfa1;
}

.hills.front {
  filter: drop-shadow(0 -2px 3px rgba(43, 51, 87, .12));
}

.sw[aria-checked="false"] .hills.back path {
  fill: #3a446f;
}

.sw[aria-checked="false"] .hills.front path {
  fill: #2b3357;
}

.sw[aria-checked="false"] .hills {
  transform: translateY(4px);
}

.orb {
  position: absolute;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  transition: transform .7s var(--spring), opacity .5s var(--ease);
}

.sun {
  left: 62%;
  top: 16%;
  background: radial-gradient(circle at 34% 30%, #fff3b0, #ffb26b 68%, #ff9f6b);
  box-shadow: inset -4px -4px 8px rgba(255, 140, 90, .35), 0 6px 14px -4px rgba(255, 150, 110, .55);
}

.sw[aria-checked="false"] .sun {
  transform: translateY(74px) scale(.6);
  opacity: 0;
}

.moon {
  left: 62%;
  top: 16%;
  transform: translateY(74px) scale(.6);
  opacity: 0;
  filter: drop-shadow(0 0 8px rgba(253, 246, 216, .7));
}

.sw[aria-checked="false"] .moon {
  transform: none;
  opacity: 1;
}

.star {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #fdf6d8;
  opacity: 0;
  animation: tw 2.2s var(--d, 0s) infinite ease-in-out;
  transition: opacity .4s var(--ease) .15s;
}

.star.s2 {
  width: 3px;
  height: 3px;
}

.sw[aria-checked="false"] .star {
  opacity: .95;
}

@keyframes tw {

  0%,
  100% {
    transform: scale(1);
  }

  50% {
    transform: scale(.55);
    opacity: .4;
  }
}

.knob {
  position: absolute;
  left: 4px;
  top: 4px;
  width: var(--k);
  height: var(--k);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 34% 28%, #ffffff, #e4e9fb 72%);
  color: var(--fg);
  box-shadow: inset -5px -5px 10px rgba(43, 51, 87, .16), inset 5px 5px 10px rgba(255, 255, 255, .9), 0 8px 18px -6px rgba(43, 51, 87, .4);
  transition: transform .6s var(--spring), width .3s var(--spring);
}

.sw[aria-checked="false"] .knob {
  transform: translateX(calc(var(--w) - var(--pad) * 2 - var(--k) - 8px));
}

.sw:active .knob {
  width: calc(var(--k) + 8px);
}

.ico {
  position: absolute;
  width: 26px;
  height: 26px;
  transition: opacity .35s var(--ease), transform .6s var(--spring);
}

.sun-i {
  opacity: 1;
  transform: none;
}

.moon-i {
  opacity: 0;
  transform: rotate(-40deg) scale(.5);
}

.sw[aria-checked="false"] .sun-i {
  opacity: 0;
  transform: rotate(40deg) scale(.5);
}

.sw[aria-checked="false"] .moon-i {
  opacity: 1;
  transform: none;
}
</style></head><body><div id="__z" style="width:100%;height:100%;display:grid;place-items:center;transform-origin:50% 50%"><div class="wrap">

        <i class="star s2" style="left:44%;top:14%;--d:.7s"></i>
        <i class="star" style="left:60%;top:30%;--d:1.3s"></i>
        <i class="star s2" style="left:76%;top:18%;--d:.4s"></i>
        <i class="star" style="left:38%;top:34%;--d:1.1s"></i>
        <svg class="orb moon" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="14" fill="#fdf6d8"/>

          <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>
          </g>

        <svg class="ico moon-i" viewBox="0 0 24 24">
          <path d="M18.5 14.2A7 7 0 0 1 9.8 5.5a7.2 7.2 0 1 0 8.7 8.7z" fill="currentColor"/>
        </svg>
      </span>
    </span>
  </button>
</div>
</div><div id="__cur" style="position:fixed;left:0;top:0;width:34px;height:34px;pointer-events:none;z-index:2147483647;opacity:0;transform:translate(-100px,-100px);transition:opacity .25s"><svg viewBox="0 0 24 24" width="34" height="34" style="filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))"><path d="M4 2.5v17.2l4.6-4.1 3.1 6.6 3-1.4-3.1-6.5 6.3-.3z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<style>#__rip{position:fixed;width:12px;height:12px;border-radius:50%;border:3px solid rgba(124,92,255,.9);pointer-events:none;z-index:2147483646;transform:translate(-50%,-50%) scale(.2);opacity:0}#__rip.go{animation:__rip .55s ease-out}@keyframes __rip{0%{opacity:.9;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.2)}}</style><div id="__rip"></div>
<script>(function(){var c=document.getElementById('__cur'),r=document.getElementById('__rip');addEventListener('mousemove',function(e){c.style.opacity=1;c.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'},true);addEventListener('mousedown',function(e){c.firstElementChild.style.transform='scale(.82)';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';r.classList.remove('go');void r.offsetWidth;r.classList.add('go')},true);addEventListener('mouseup',function(){c.firstElementChild.style.transform='scale(1)'},true)})();</script><script>const sw = document.getElementById('sw');

sw.addEventListener('click', () => {

</script><script>addEventListener('load',function(){setTimeout(function(){var z=document.getElementById('__z'),l=1e9,t=1e9,r=0,b=0;[].forEach.call(z.children,function(e){var x=e.getBoundingClientRect();if(!x.width)return;l=Math.min(l,x.left);t=Math.min(t,x.top);r=Math.max(r,x.right);b=Math.max(b,x.bottom)});var w=r-l,h=b-t;if(w>0&&h>0){var k=Math.max(1,Math.min(1.5,590/w,330/h));z.style.transform='scale('+k.toFixed(3)+')'}},60)})</script></body></html>
