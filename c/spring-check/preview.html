.wrap {
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 24px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.list {
  display: grid;
  gap: 8px;
  width: min(440px, 100%);
  padding: 20px 22px;
  background: linear-gradient(180deg, rgba(124, 255, 107, .05), rgba(124, 255, 107, .015));
  border: 1px dotted rgba(124, 255, 107, .28);
  border-radius: calc(var(--radius) + 4px);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(124, 255, 107, .1);
}

.list::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .16) 0 1px, transparent 1px 4px);
  pointer-events: none;
  opacity: .6;
}

.sc {
  --box: 30px;
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 48px;
  padding: 0 4px;
  border: 0;
  border-radius: var(--radius);
  background: none;
  color: var(--fg);
  font: 500 17px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
  letter-spacing: .015em;
  text-align: left;
  cursor: pointer;
  outline: none;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.sc:focus-visible {
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px rgba(124, 255, 107, .55);
}

.press {
  flex: none;
  width: var(--box);
  height: var(--box);
  border-radius: var(--radius);
  transition: transform .18s cubic-bezier(.34, 1.56, .64, 1);
}

.sc.down .press {
  transform: scale(.95);
}

.box {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  border-radius: inherit;
  overflow: hidden;
}

.ring {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1.5px var(--accent);
  opacity: .28;
  transition: opacity .2s var(--ease);
}

@media (hover: hover) and (pointer: fine) {
  .sc:hover .ring {
    opacity: .5;
  }
}

.fill {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--accent);
  box-shadow: 0 0 10px rgba(124, 255, 107, .35), inset 0 1px 0 rgba(255, 255, 255, .45);
  transform: scale(0);
  will-change: transform;
}

.tick {
  position: relative;
  width: 66%;
  height: 66%;
  overflow: visible;
  fill: none;
  stroke: var(--bg);
  stroke-width: 2.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tick path {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
}

.lab {
  position: relative;
  display: inline-block;
  padding: 2px 0;
}

.word {
  display: inline-block;
  transition: opacity .12s linear;
}

.rule {
  position: absolute;
  left: 0;
  right: 0;
  top: 52%;
  height: 1.5px;
  border-radius: 1px;
  background: var(--muted);
  transform-origin: left center;
  transform: scaleX(0);
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {

  .press,
  .ring,
  .word {
    transition: none;
  }
}
