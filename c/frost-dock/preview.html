  --base: 52px;

  height: 100%;

}

.dock {
  display: flex;
  align-items: flex-end;
  gap: 8px;

  padding: 0 12px 12px;

  position: relative;
  background: rgba(255, 255, 255, .55);
  backdrop-filter: blur(20px) saturate(1.6);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
  border: 1px solid rgba(255, 255, 255, .6);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), var(--shadow);
}

.it {
  position: relative;
  width: var(--base);
  height: var(--base);
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: linear-gradient(145deg, var(--g1), var(--g2));
  cursor: pointer;
  transform-origin: bottom center;

.it:active {
  transform: scale(.94);
}

.it:focus-visible {
  outline: none;
  box-shadow: inset 0 0 0 2px var(--accent), 0 8px 14px -6px rgba(0, 0, 0, .35);
}

.tip {
  position: absolute;
  bottom: calc(100% + 12px);
  left: 50%;
  padding: 5px 11px;
  border-radius: 9px;
  white-space: nowrap;
  font: 600 12px/1 inherit;
  letter-spacing: .01em;
  color: var(--fg);
  background: rgba(20, 22, 26, .85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12), 0 8px 20px -6px rgba(0, 0, 0, .5);
  opacity: 0;
  transform: translate(-50%, 6px) scale(.9);
  transition: opacity .2s, transform .3s var(--ease);
  pointer-events: none;
}

.it.on .tip {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}

.glyph {
  position: relative;
  display: block;
  width: 52%;
  height: 52%;
}

.bars {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}

.bars i {
  width: 22%;
  border-radius: 2px;
  background: var(--accent);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .15);
}

.bars i:nth-child(1) {
  height: 45%;
}

.bars i:nth-child(2) {
  height: 75%;
}

.bars i:nth-child(3) {
  height: 100%;
}

.doc {
  border-radius: 3px;
  background: #eef2f6;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
}

.doc::after {
  content: "";
  position: absolute;
  left: 18%;
  right: 18%;
  top: 30%;
  height: 2px;
  background: #9aa4b0;
  box-shadow: 0 8px 0 #9aa4b0, 0 16px 0 #9aa4b0;
}

.coin {
  border-radius: 50%;
  background: var(--ink);
  box-shadow: inset 0 0 0 3px var(--accent);
}

.coin::after {
  content: "";
  position: absolute;
  inset: 30%;
  border-radius: 50%;
  background: var(--accent);
}

.card {
  border-radius: 4px;
  background: linear-gradient(160deg, #dfe6ee, #aeb8c4);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
}

.card::after {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  top: 22%;
  height: 22%;
  border-radius: 2px;
  background: var(--accent);
}

.pie {
  border-radius: 50%;
  background: conic-gradient(var(--accent) 0 62%, #eef2f6 62% 100%);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
}

.wallet {
  border-radius: 4px;
  background: #eef2f6;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
}

.wallet::after {
  content: "";
  position: absolute;
  right: 0;
  top: 30%;
  width: 34%;
  height: 40%;
  border-radius: 3px 0 0 3px;
  background: var(--accent);
}

.gear {
  border-radius: 50%;
  background: #eef2f6;
  box-shadow: inset 0 0 0 4px var(--accent);
}

.gear::after {
  content: "";
  position: absolute;
  inset: 38%;
  border-radius: 50%;
  background: var(--ink);
}
