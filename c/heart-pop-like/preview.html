.stage-wrap {
  display: grid;
  place-items: center;
  min-height: 380px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.like {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  height: 56px;
  padding: 0 24px 0 18px;
  border: 0;
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--fg);
  background: linear-gradient(180deg, #17171a, var(--surface));
  font: 500 20px/1 inherit;
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .06), 0 0 0 1px var(--hairline);
  transition: transform .3s var(--spring), box-shadow .4s var(--ease), background .3s var(--ease);
}

@media (hover: hover) and (pointer: fine) {
  .like:hover {
    transform: translateY(-2px);
    background: linear-gradient(180deg, #1b1b1f, #16161a);
  }
}

.like:active {
  transform: scale(.97);
}

.like:focus-visible {
  outline: none;
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .06), 0 0 0 1px var(--hairline), 0 0 0 3px rgba(94, 106, 210, .55);
}

.heart {
  position: relative;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
}

.heart svg {
  width: 28px;
  height: 28px;
  fill: transparent;
  stroke: var(--muted);
  stroke-width: 1.9;
  stroke-linejoin: round;
  transition: stroke .3s var(--ease), fill .3s var(--ease);
}

.like[aria-pressed=true] .heart svg {
  fill: var(--accent);
  stroke: var(--accent);
  animation: pop .6s var(--spring);
}

.like[aria-pressed=true] {
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .08), 0 0 0 1px rgba(94, 106, 210, .45), 0 0 22px -6px rgba(94, 106, 210, .55);
}

@keyframes pop {
  0% {
    transform: scale(.4);
  }

  55% {
    transform: scale(1.35);
  }

  80% {
    transform: scale(.95);
  }

  100% {
    transform: scale(1);
  }
}

.heart i {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 5px;
  margin: -2.5px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
}

.heart i:nth-of-type(even) {
  width: 4px;
  height: 4px;
  background: #b7bcf0;
}

.like[aria-pressed=true] .heart i {
  animation: burst .65s .05s var(--ease) both;
}

@keyframes burst {
  0% {
    opacity: 1;
    transform: rotate(var(--a)) translateY(-10px) scale(1);
  }

  100% {
    opacity: 0;
    transform: rotate(var(--a)) translateY(-32px) scale(.2);
  }
}

.count {
  height: 24px;
  overflow: hidden;
  color: var(--muted);
  transition: color .3s var(--ease);
}

.roll {
  display: flex;
  flex-direction: column;
  transition: transform .45s var(--ease);
}

.roll b {
  height: 24px;
  line-height: 24px;
  font-weight: 500;
}

.like[aria-pressed=true] .roll {
  transform: translateY(-24px);
}

.like[aria-pressed=true] .count {
  color: var(--fg);
}

@media (prefers-reduced-motion: reduce) {

  .like[aria-pressed=true] .heart svg,
  .like[aria-pressed=true] .heart i {
    animation: none;
  }
}
