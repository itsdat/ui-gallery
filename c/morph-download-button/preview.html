  --bg: #101012;

}

.wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

.dl {
  position: relative;
  width: 220px;
  height: 56px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  overflow: hidden;
  color: var(--fg);
  background: var(--surface);
  font: 500 15px/1 inherit;
  letter-spacing: -.01em;
  box-shadow: var(--shadow);
  transition: width .5s var(--ease), background .4s var(--ease), border-color .3s, transform .2s var(--ease), box-shadow .4s var(--ease);
}

.dl:hover {
  border-color: var(--line-hi);
  background: #17171a;
}

.dl:active {
  transform: scale(.97);
}

.dl:focus-visible {
  outline: none;
  box-shadow: var(--shadow), 0 0 0 3px rgba(94, 106, 210, .45);
}

.lab {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity .25s var(--ease), transform .45s var(--ease);
}

.lab svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform .35s var(--ease);
}

.dl:hover .arrow {
  transform: translateY(2px);
}

.fill {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-hi));
  transform: scaleX(0);
  transform-origin: left center;
  opacity: 0;
  transition: opacity .25s var(--ease);
}

.pct {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  opacity: 0;
  transition: opacity .2s var(--ease);
}

.lab-done {
  opacity: 0;
  transform: translateY(12px);
}

.tick {
  width: 13px;
  height: 7px;
  border-left: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(-45deg) scale(.5);
  opacity: 0;
}

.dl[data-s=load] {
  width: 220px;
  border-color: rgba(94, 106, 210, .55);
  cursor: progress;
}

.dl[data-s=load] .lab-idle {
  opacity: 0;
  transform: translateY(-12px);
}

.dl[data-s=load] .fill {
  opacity: 1;
}

.dl[data-s=load] .pct {
  opacity: 1;
}

.dl[data-s=done] {
  width: 220px;
  background: var(--accent);
  border-color: var(--accent-hi);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 34px -14px rgba(94, 106, 210, .6), inset 0 1px 0 rgba(255, 255, 255, .18);
}

.dl[data-s=done] .fill,
.dl[data-s=done] .pct {
  opacity: 0;
}

.dl[data-s=done] .lab-idle {
  opacity: 0;
  transform: translateY(-12px);
}

.dl[data-s=done] .lab-done {
  opacity: 1;
  transform: none;
}

.dl[data-s=done] .tick {
  animation: pop .5s .15s var(--spring) forwards;
}

@keyframes pop {
  0% {
    opacity: 0;
    transform: rotate(-45deg) scale(.4);
  }

  60% {
    opacity: 1;
    transform: rotate(-45deg) scale(1.2);
  }

  100% {
    opacity: 1;
    transform: rotate(-45deg) scale(1);
  }
}

.meta {
  margin: 0;
  font: 500 12.5px/1 inherit;
  color: var(--muted);
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
}
