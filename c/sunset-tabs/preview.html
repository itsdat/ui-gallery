<!DOCTYPE html><html><head><meta charset='utf-8'><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:grid;place-items:center;background:linear-gradient(135deg,#f3ecff 0%,#fdf4fa 55%,#eef6ff 100%);font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'cv11','ss01'}button,input{font-family:inherit}*{-webkit-tap-highlight-color:transparent}button{-webkit-user-select:none;user-select:none}</style><style>:root {
  --bg: #fff1e6;
  --surface: #fffaf5;
  --ink: #1f1a17;
  --muted: #8a7a6d;
  --accent: #ff6b35;
  --accent-2: #f7b267;
  --radius: 20px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.3, .64, 1);
  --shadow: 0 1px 2px rgba(31, 26, 23, .06), 0 18px 40px -20px rgba(255, 107, 53, .35);
}

.ui {
  width: 480px;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--ink);
}

.tabs {
  position: relative;
  display: flex;
  padding: 6px;
  border-radius: var(--radius);
  background: rgba(31, 26, 23, .05);
  box-shadow: inset 0 1px 2px rgba(31, 26, 23, .08);
}

.pill {
  position: absolute;
  top: 6px;
  bottom: 6px;
  left: 6px;
  width: 0;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 1px 2px rgba(31, 26, 23, .12), 0 8px 18px -6px rgba(255, 107, 53, .55), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: left .35s var(--spring), width .35s var(--spring);
}

.tab {
  position: relative;
  z-index: 1;
  flex: 1;
  height: 42px;
  border: 0;
  background: none;
  font: 600 13.5px/1 system-ui, sans-serif;
  color: var(--muted);
  cursor: pointer;
  border-radius: 14px;
  transition: color .3s var(--ease), transform .2s var(--ease);
}

.tab:hover {
  color: var(--ink);
}

.tab:active {
  transform: scale(.97);
}

.tab.on {
  color: #fff;
  text-shadow: 0 1px 1px rgba(31, 26, 23, .15);
}

.tab:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.panel {
  margin-top: 14px;
  padding: 22px 24px 18px;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.cap {
  margin: 0;
  font: 500 13px/1.2 ui-serif, Georgia, serif;
  color: var(--muted);
  transition: opacity .25s var(--ease), transform .4s var(--ease);
}

.row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-top: 6px;
}

strong {
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}

.delta {
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  color: #fff;
  background: var(--accent);
}

.wave {
  display: flex;
  align-items: flex-end;
  gap: 5px;
  height: 50px;
  margin-top: 12px;
}

.bar {
  flex: 1;
  height: var(--h);
  border-radius: 3px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  opacity: .85;
  transform-origin: bottom;
  animation: rise .5s var(--ease) both;
}

.panel.swap .cap {
  opacity: 0;
  transform: translateY(6px);
}

@keyframes rise {
  from {
    transform: scaleY(.2);
    opacity: 0;
  }
}
</style></head><body><div id="__z" style="width:100%;height:100%;display:grid;place-items:center;transform-origin:50% 50%"><div class="ui">

</div>
</div><div id="__cur" style="position:fixed;left:0;top:0;width:34px;height:34px;pointer-events:none;z-index:2147483647;opacity:0;transform:translate(-100px,-100px);transition:opacity .25s"><svg viewBox="0 0 24 24" width="34" height="34" style="filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))"><path d="M4 2.5v17.2l4.6-4.1 3.1 6.6 3-1.4-3.1-6.5 6.3-.3z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<style>#__rip{position:fixed;width:12px;height:12px;border-radius:50%;border:3px solid rgba(124,92,255,.9);pointer-events:none;z-index:2147483646;transform:translate(-50%,-50%) scale(.2);opacity:0}#__rip.go{animation:__rip .55s ease-out}@keyframes __rip{0%{opacity:.9;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.2)}}</style><div id="__rip"></div>
<script>(function(){var c=document.getElementById('__cur'),r=document.getElementById('__rip');addEventListener('mousemove',function(e){c.style.opacity=1;c.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'},true);addEventListener('mousedown',function(e){c.firstElementChild.style.transform='scale(.82)';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';r.classList.remove('go');void r.offsetWidth;r.classList.add('go')},true);addEventListener('mouseup',function(){c.firstElementChild.style.transform='scale(1)'},true)})();</script><script>const tabs = [...document.querySelectorAll('.tab')];
const pill = document.getElementById('pill');
const num = document.getElementById('num');
const cap = document.getElementById('cap');
const delta = document.getElementById('delta');
const panel = document.querySelector('.panel');
let current = 12480,
  raf = 0;

const place = (t) => {
  pill.style.left = t.offsetLeft + 'px';
  pill.style.width = t.offsetWidth + 'px';

const count = (to) => {
  cancelAnimationFrame(raf);
  const from = current,
    t0 = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - t0) / 700),
      e = 1 - Math.pow(1 - p, 3);

    if (p < 1) raf = requestAnimationFrame(step);
  })(t0);
};

  tabs.forEach((x) => x.classList.toggle('on', x ===
    t));
  place(t);
  count(+t.dataset.n);
  cap.textContent = t.dataset.c;
  delta.textContent = t.dataset.d;
  panel.classList.add('swap');
  setTimeout(() => {
    panel.classList.remove('swap');
    panel.querySelectorAll('.bar').forEach((
      b) => {
        b.style.animation = 'none';

        b.style.animation = '';
      });
  }, 180);

</script><script>addEventListener('load',function(){setTimeout(function(){var z=document.getElementById('__z'),l=1e9,t=1e9,r=0,b=0;[].forEach.call(z.children,function(e){var x=e.getBoundingClientRect();if(!x.width)return;l=Math.min(l,x.left);t=Math.min(t,x.top);r=Math.max(r,x.right);b=Math.max(b,x.bottom)});var w=r-l,h=b-t;if(w>0&&h>0){var k=Math.max(1,Math.min(1.5,590/w,330/h));z.style.transform='scale('+k.toFixed(3)+')'}},60)})</script></body></html>
