  --ease-out: cubic-bezier(.2, .8, .2, 1);
}

.wrap {
  display: grid;
  place-items: center;
  padding: 24px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 176px);
  gap: 16px;
}

.card {
  position: relative;
  height: 212px;
  padding: 20px 18px 16px;
  border-radius: var(--radius);
  isolation: isolate;
  display: flex;
  flex-direction: column;
  color: var(--fg);
  background: linear-gradient(180deg, var(--card-top), var(--card));
  backdrop-filter: blur(20px) saturate(1.6);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: var(--shadow);
  transition: transform .45s var(--ease), box-shadow .45s var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .card:hover {
    transform: translateY(-4px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 4px 10px -2px rgba(0, 0, 0, .55), 0 32px 64px -24px rgba(0, 0, 0, .8);
  }
}

.card::before,
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0;
  transition: opacity 300ms var(--ease-out);
  pointer-events: none;
}

.card::before {
  z-index: -1;
  background: radial-gradient(240px circle at var(--x, 50%) var(--y, 50%), rgba(245, 165, 36, .2), transparent 68%);
}

.card::after {
  padding: 1px;
  background: radial-gradient(160px circle at var(--x, 50%) var(--y, 50%), rgba(255, 205, 120, .95), transparent 72%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}

.grid:hover .card::before,
.grid:hover .card::after {
  opacity: 1;
}

.ico {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px rgba(245, 165, 36, .26), inset 0 1px 0 rgba(255, 255, 255, .12);
}

.ico svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

h3 {
  margin: 20px 0 6px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -.012em;
  text-wrap: balance;
}

p {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--muted);
  letter-spacing: -.002em;
}

footer {
  margin-top: auto;
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

footer b {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
}

footer span {
  font-size: 11.5px;
  color: var(--muted);
}

.card:focus-visible {
  outline: none;
  box-shadow: var(--shadow), 0 0 0 2px var(--accent);
}

@media (prefers-reduced-motion: reduce) {

  .card,
  .card::before,
  .card::after {
    transition-duration: .01ms;
  }
}
