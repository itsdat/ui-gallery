:root {
  --bg: #f4f1ea;
  --fg: #1b1915;
  --muted: #6f6a60;
  --accent: #e8912a;
  --accent-soft: #ffd9a0;
  --radius: 999px;
  --ease: cubic-bezier(.2, .8, .2, 1);

  --shadow: 0 1px 1px rgba(0, 0, 0, .04), 0 20px 50px -20px rgba(0, 0, 0, .25);

.wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.ob {
  --spd: 3s;
  position: relative;
  padding: 1.5px;
  border: 0;
  border-radius: var(--radius);
  cursor: pointer;
  isolation: isolate;
  background: conic-gradient(from var(--ang), rgba(0, 0, 0, .1) 0 58%, var(--accent) 80%, var(--accent-soft) 90%, rgba(0, 0, 0, .1) 100%);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .6) inset;
  animation: spin var(--spd) linear infinite;
  transition: transform .35s var(--spring);
}

@keyframes spin {
  to {
    --ang: 360deg;
  }
}

.ob:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(232, 145, 42, .35);
}

@media (hover: hover) and (pointer: fine) {
  .ob:hover {
    --spd: 1.2s;
    transform: translateY(-2px);
  }
}

.ob:active {
  transform: scale(.97);
}

.in {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 54px;
  padding: 0 28px;
  border-radius: var(--radius);
  overflow: hidden;
  color: var(--fg);
  background: rgba(255, 255, 255, .58);
  backdrop-filter: blur(20px) saturate(1.6);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.012em;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), var(--shadow);
  transition: background .3s var(--ease);
}

.ob:hover .in {
  background: rgba(255, 255, 255, .8);
}

.lbl {
  display: flex;
  align-items: center;
  gap: 6px;
  transition: transform .5s var(--ease), opacity .3s var(--ease);
}

.l2 {
  position: absolute;
  left: 0;
  right: 0;
  justify-content: center;
  transform: translateY(150%);
  opacity: 0;
  color: #a85f00;
}

.l2 svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.arr {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform .4s var(--spring), opacity .3s var(--ease);
}

.ob:hover .arr {
  transform: translateX(4px);
}

.ob.done .l1 {
  transform: translateY(-150%);
  opacity: 0;
}

.ob.done .l2 {
  transform: none;
  opacity: 1;
}

.ob.done .arr {
  opacity: 0;
  transform: scale(.5);
}

.note {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.dots {
  display: flex;
}

.dots i {
  width: 20px;
  height: 20px;
  margin-left: -7px;
  border-radius: 50%;
  border: 2px solid var(--bg);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35);
}

.dots i:first-child {
  margin-left: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent-soft));
}

.dots i:nth-child(2) {
  background: linear-gradient(135deg, #8a8f99, #c4c8cf);
}

.dots i:nth-child(3) {
  background: linear-gradient(135deg, #3f3a33, #6b6459);
}
