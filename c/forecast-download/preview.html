<!DOCTYPE html><html><head><meta charset='utf-8'><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:grid;place-items:center;background:linear-gradient(135deg,#f3ecff 0%,#fdf4fa 55%,#eef6ff 100%);font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'cv11','ss01'}button,input{font-family:inherit}*{-webkit-tap-highlight-color:transparent}button{-webkit-user-select:none;user-select:none}</style><style>:root {
  --ink: #111;
  --paper: #fff7e6;
  --paper-hi: #ffeeb8;
  --ok: #3ddc97;
  --muted: #7a6b45;
  --radius: 30px;
  --ease: cubic-bezier(.34, 1.56, .64, 1);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --shadow: 4px 4px 0 var(--ink);
}

.wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.dl {
  position: relative;
  width: 216px;
  height: 60px;
  padding: 0;
  border: 2.5px solid var(--ink);
  border-radius: var(--radius);
  cursor: pointer;
  overflow: hidden;
  color: var(--ink);
  background: var(--paper);
  font: 800 18px/1 system-ui, -apple-system, sans-serif;
  letter-spacing: -.01em;
  box-shadow: var(--shadow);
  transition: width .6s var(--ease), background .4s var(--ease-out), transform .16s var(--ease-out), box-shadow .16s var(--ease-out);
}

/* progress fill layer */
.dl::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--paper-hi);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform .12s linear;
  z-index: 0;
}

.dl:hover {
  background: color-mix(in srgb, var(--paper) 90%, var(--ink));
}

.dl:active {
  transform: translate(4px, 4px);
  box-shadow: 0 0 0 var(--ink);
}

.dl:focus-visible {
  outline: 2.5px solid var(--ink);
  outline-offset: 4px;
}

.lab {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: opacity .3s, transform .45s var(--ease-out);
}

.arrow {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform .35s var(--ease-out);
}

.dl:hover .arrow {
  transform: translateY(2px);
}

.lab-done {
  opacity: 0;
  transform: translateY(14px);
}

.pct {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  opacity: 0;
  transition: opacity .25s;
}

.dl[data-s=load] {
  width: 60px;
}

.dl[data-s=load] .lab-idle {
  opacity: 0;
  transform: translateY(-14px);
}

.dl[data-s=load] .pct {
  opacity: 1;
}

.dl[data-s=done] {
  background: var(--ok);
  width: 216px;
}

.dl[data-s=done]::before {
  transform: scaleX(1);
  background: var(--ok);
}

.dl[data-s=done] .lab-idle {
  opacity: 0;
  transform: translateY(-14px);
}

.dl[data-s=done] .pct {
  opacity: 0;
}

.dl[data-s=done] .lab-done {
  opacity: 1;
  transform: none;
}

/* CSS check mark drawn with rotated borders */
.tick {
  width: 20px;
  height: 20px;
  position: relative;
  transform: rotate(45deg) scale(.7);
  opacity: 0;
  transition: transform .5s var(--ease), opacity .2s;
}

.tick::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 9px;
  width: 6px;
  height: 2.5px;
  background: var(--ink);
  border-radius: 2px;
}

.tick::after {
  content: "";
  position: absolute;
  left: 6px;
  top: 0;
  width: 2.5px;
  height: 12px;
  background: var(--ink);
  border-radius: 2px;
}

.dl[data-s=done] .tick {
  transform: rotate(45deg) scale(1);
  opacity: 1;
  transition-delay: .22s;
}

.meta {
  margin: 0;
  font: 700 13px system-ui, -apple-system, sans-serif;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
</style></head><body><div id="__z" style="width:100%;height:100%;display:grid;place-items:center;transform-origin:50% 50%"><div class="wrap">
  <button class="dl" id="dl" data-s="idle" type="button">
    <span class="lab lab-idle">
      <svg viewBox="0 0 24 24" class="arrow" aria-hidden="true">
        <path d="M12 4.5v11M7.5 11.5l4.5 4.5 4.5-4.5M5 19.5h14"/>
      </svg>
      Get forecast
    </span>
    <span class="pct" id="pct">0%</span>
    <span class="lab lab-done">
      <span class="tick" aria-hidden="true"></span>
      Forecast saved
    </span>
  </button>
  <p class="meta" id="meta">weather-pack.zip · 12.4 MB</p>
</div>
</div><div id="__cur" style="position:fixed;left:0;top:0;width:34px;height:34px;pointer-events:none;z-index:2147483647;opacity:0;transform:translate(-100px,-100px);transition:opacity .25s"><svg viewBox="0 0 24 24" width="34" height="34" style="filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))"><path d="M4 2.5v17.2l4.6-4.1 3.1 6.6 3-1.4-3.1-6.5 6.3-.3z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<style>#__rip{position:fixed;width:12px;height:12px;border-radius:50%;border:3px solid rgba(124,92,255,.9);pointer-events:none;z-index:2147483646;transform:translate(-50%,-50%) scale(.2);opacity:0}#__rip.go{animation:__rip .55s ease-out}@keyframes __rip{0%{opacity:.9;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.2)}}</style><div id="__rip"></div>
<script>(function(){var c=document.getElementById('__cur'),r=document.getElementById('__rip');addEventListener('mousemove',function(e){c.style.opacity=1;c.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'},true);addEventListener('mousedown',function(e){c.firstElementChild.style.transform='scale(.82)';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';r.classList.remove('go');void r.offsetWidth;r.classList.add('go')},true);addEventListener('mouseup',function(){c.firstElementChild.style.transform='scale(1)'},true)})();</script><script>const btn = document.getElementById('dl');
const pct = document.getElementById('pct');
const meta = document.getElementById('meta');
const D = 1900;

function run() {
  btn.dataset.s = 'load';
  const t0 = performance.now();
  (function tick(now) {
    const p = Math.min(1, (now - t0) / D);
    const e = 1 - Math.pow(1 - p, 2.2);
    btn.style.setProperty('--p', e);
    btn.style.background = '';
    btn.style.setProperty('--fill', e);
    btn.querySelector(':scope') && null;
    btn.style.setProperty('--scale', e);
    btn.style.setProperty('--prog', e);
    pct.textContent = Math.round(e * 100) + '%';
    meta.textContent = 'weather-pack.zip · ' + (12.4 *
      e).toFixed(1) + ' / 12.4 MB';
    if (p < 1) requestAnimationFrame(tick);
    else {
      btn.dataset.s = 'done';
      meta.textContent = 'Saved to Downloads';
    }
  })(t0);
}

// drive the fill layer via inline scaleX on ::before using a CSS var
btn.addEventListener('click', () => {
  if (btn.dataset.s === 'idle') {
    run();
  } else if (btn.dataset.s === 'done') {
    btn.dataset.s = 'idle';
    pct.textContent = '0%';
    meta.textContent = 'weather-pack.zip · 12.4 MB';
  }
});
</script><script>addEventListener('load',function(){setTimeout(function(){var z=document.getElementById('__z'),l=1e9,t=1e9,r=0,b=0;[].forEach.call(z.children,function(e){var x=e.getBoundingClientRect();if(!x.width)return;l=Math.min(l,x.left);t=Math.min(t,x.top);r=Math.max(r,x.right);b=Math.max(b,x.bottom)});var w=r-l,h=b-t;if(w>0&&h>0){var k=Math.max(1,Math.min(1.5,590/w,330/h));z.style.transform='scale('+k.toFixed(3)+')'}},60)})</script></body></html>
