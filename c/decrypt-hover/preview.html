<!DOCTYPE html><html><head><meta charset='utf-8'><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:grid;place-items:center;background:linear-gradient(135deg,#f3ecff 0%,#fdf4fa 55%,#eef6ff 100%);font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'cv11','ss01'}button,input{font-family:inherit}*{-webkit-tap-highlight-color:transparent}button{-webkit-user-select:none;user-select:none}</style><style>:root {
  --bg: #f5f9ff;
  --fg: #0f172a;
  --muted: #64748b;
  --dim: #94a3b8;
  --acc: #2563eb;
  --tint: #dbeafe;
  --line: rgba(37, 99, 235, .22);
  --radius: 12px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px -8px rgba(37, 99, 235, .25);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}

.box {
  width: 420px;
  font-family: var(--mono);
}

.head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  padding: 0 4px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--acc);
  box-shadow: 0 0 0 3px var(--tint);
}

.head h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--fg);
}

.count {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

li {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 14px 16px;
  margin-bottom: 8px;
  border-radius: var(--radius);
  cursor: default;
  background: #ffffff;
  box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .07), 0 1px 2px rgba(15, 23, 42, .06);
  transition: background .3s var(--ease), box-shadow .3s var(--ease), transform .4s var(--ease);
}

li:hover {
  background: #f8fbff;
  box-shadow: inset 0 0 0 1px var(--line), var(--shadow);
  transform: translateX(4px);
}

li:active {
  transform: translateX(4px) scale(.985);
}

.k {
  font-size: 12px;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
  transition: color .3s var(--ease);
}

li:hover .k {
  color: var(--acc);
}

.t {
  font-size: 18px;
  letter-spacing: .01em;
  color: var(--dim);
  white-space: pre;
  transition: color .3s var(--ease);
}

.t .r {
  color: var(--fg);
}
</style></head><body><div id="__z" style="width:100%;height:100%;display:grid;place-items:center;transform-origin:50% 50%"><div class="box">
  <div class="head">
    <span class="dot"></span>
    <h2>Vault files</h2>
    <span class="count">3 items</span>
  </div>
  <ul id="list">
    <li data-t="Q3_ROADMAP.pdf"><span class="k">01</span><span class="t"></span></li>
    <li data-t="PAYROLL_2024.xlsx"><span class="k">02</span><span class="t"></span></li>
    <li data-t="KEYS_BACKUP.enc"><span class="k">03</span><span class="t"></span></li>
  </ul>
</div>
</div><div id="__cur" style="position:fixed;left:0;top:0;width:34px;height:34px;pointer-events:none;z-index:2147483647;opacity:0;transform:translate(-100px,-100px);transition:opacity .25s"><svg viewBox="0 0 24 24" width="34" height="34" style="filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))"><path d="M4 2.5v17.2l4.6-4.1 3.1 6.6 3-1.4-3.1-6.5 6.3-.3z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<style>#__rip{position:fixed;width:12px;height:12px;border-radius:50%;border:3px solid rgba(124,92,255,.9);pointer-events:none;z-index:2147483646;transform:translate(-50%,-50%) scale(.2);opacity:0}#__rip.go{animation:__rip .55s ease-out}@keyframes __rip{0%{opacity:.9;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.2)}}</style><div id="__rip"></div>
<script>(function(){var c=document.getElementById('__cur'),r=document.getElementById('__rip');addEventListener('mousemove',function(e){c.style.opacity=1;c.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'},true);addEventListener('mousedown',function(e){c.firstElementChild.style.transform='scale(.82)';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';r.classList.remove('go');void r.offsetWidth;r.classList.add('go')},true);addEventListener('mouseup',function(){c.firstElementChild.style.transform='scale(1)'},true)})();</script><script>const GLYPHS = '!<>-_\\/[]{}=+*^?#%&01';
const rand = () => GLYPHS[Math.floor(Math.random() *
  GLYPHS.length)];
const scramble = (s) => s.replace(/[^ ]/g, rand);

document.querySelectorAll('li').forEach((li) => {
  const out = li.querySelector('.t');
  const target = li.dataset.t;
  let raf = 0;
  out.textContent = scramble(target);

  const decode = () => {
    cancelAnimationFrame(raf);
    const t0 = performance.now(),
      D = 900;
    (function frame(now) {
      const n = Math.floor(Math.min(1, (now -
        t0) / D) * target.length);
      const rest = target.slice(n).replace(
        /[^ ]/g, rand);
      out.innerHTML = '<span class="r">' + target
        .slice(0, n) + '</span>' + rest;
      if (n < target.length) raf =
        requestAnimationFrame(frame);
      else out.innerHTML = '<span class="r">' +
        target + '</span>';
    })(t0);
  };

  li.addEventListener('mouseenter', decode);
  li.addEventListener('mouseleave', () => {
    cancelAnimationFrame(raf);
    out.textContent = scramble(target);
  });
});
</script><script>addEventListener('load',function(){setTimeout(function(){var z=document.getElementById('__z'),l=1e9,t=1e9,r=0,b=0;[].forEach.call(z.children,function(e){var x=e.getBoundingClientRect();if(!x.width)return;l=Math.min(l,x.left);t=Math.min(t,x.top);r=Math.max(r,x.right);b=Math.max(b,x.bottom)});var w=r-l,h=b-t;if(w>0&&h>0){var k=Math.max(1,Math.min(1.5,590/w,330/h));z.style.transform='scale('+k.toFixed(3)+')'}},60)})</script></body></html>
